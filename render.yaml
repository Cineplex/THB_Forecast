services:
  - type: web
    name: thb-forecast-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.app:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      # Add other environment variables here as needed, e.g., DB connection details
      # - key: DB_USER
      #   sync: false
      # - key: DB_PASS
      #   sync: false